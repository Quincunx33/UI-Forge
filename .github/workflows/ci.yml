name: UI-Forge CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate JSON files
        run: |
          node -e "for (const f of ['package.json','plugin.json','ui-forge.config.example.json','schemas/config.schema.json','schemas/report.schema.json','schemas/agent-plugin.schema.json','.cursor-plugin/plugin.json','.cursor-plugin/marketplace.json','.claude-plugin/plugin.json','.claude-plugin/marketplace.json','ui-forge.manifest.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Install dependencies
        run: npm install
      - name: Run syntax and unit checks
        run: npm run check

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser integration test
        run: npm run test:browser
